      baseline to over 90%. Using a golden evaluation dataset with
      hard-negative indices and an automated harness, compared approaches:
      full mappings overflowed the LLM context, flattened field names helped
      modestly, and index _meta descriptions reached ~93%. Also prototyped
      semantic retrieval over per-index metadata documents and a hybrid-search
      (RRF + semantic_text) candidate pre-filter that keeps the prompt from
      growing with the number of indices. Shipped mapping-description support
      in the tool and published the results on Search Labs.
