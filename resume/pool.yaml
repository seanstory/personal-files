publications:
  # kind: talk | blog | patent | paper | article
  - id: pub-patent-12505115
    kind: patent
    title: Search query refinement using generated keyword triggers
    identifier: U.S. Patent 12,505,115 B2
    dates: { priority: 2021-08, filed: 2022-08, awarded: 2025-12 }
    tags: [patent, search, relevance]
    links: [https://patents.google.com/patent/US12505115B2/en]
    description: >
      Co-inventor, with five Elastic colleagues. A system that unifies an
      organization's content from multiple sources, dynamically assigns
      fields, and parses user queries with configurable rules into "triggers"
      (search, filter, and ranking terms) mapped to those fields to better
      match user intent. From work on Elastic Workplace Search.

  - id: pub-agentic-tooling-blog
    kind: blog
    title: Experiments in improving Agentic AI tools for Elasticsearch
    dates: { published: 2025-10 }
    tags: [ai-agents, retrieval, evaluation, hybrid-search, writing]
    links: [https://www.elastic.co/search-labs/blog/ai-agent-builder-experiments-performance]
    description: >
      Elastic Search Labs post (sole author) on systematically evaluating and
      improving Agent Builder's index-selection tool from a 77% baseline to
      over 90%, covering a golden dataset and harness, metadata enrichment,
      and a hybrid-search candidate filter.

  - id: pub-binary-document-ingestion-blog
    kind: blog
    title: "Elasticsearch binary document ingestion: Evolution & the Data Extraction Service"
    dates: { published: 2024-04 }
    tags: [document-extraction, tika, open-source, ingestion, writing]
    links: [https://www.elastic.co/search-labs/blog/binary-document-evolution]
    description: >
      Search Labs post (sole author) tracing Elastic's binary-document
      extraction from in-process Tika in Workplace Search, through the
      attachment processor, to the standalone Data Extraction Service, and
      announcing that service's open-sourcing.

  - id: pub-dls-internal-knowledge-search-blog
    kind: blog
    title: Adding document level security (DLS) to your internal knowledge search
    dates: { published: 2024-01 }
    tags: [connectors, security, document-level-security, elasticsearch, python, react, writing]
    links: [https://www.elastic.co/search-labs/blog/dls-internal-knowledge-search]
    description: >
      Search Labs post (sole author) on how connectors sync access-control
      metadata, walking through an example app (Flask + React) that mints
      short-lived, per-persona API keys with role-descriptor query
      restrictions.

  - id: pub-workplace-search-custom-sources-blog
    kind: blog
    title: "Custom sources: Search content from anywhere with Elastic Workplace Search"
    dates: { published: 2020-03 }
    tags: [workplace-search, connectors, enterprise, writing]
    links: [https://www.elastic.co/blog/custom-sources-search-content-from-anywhere-with-elastic-workplace-search]
    description: >
      Co-authored Elastic blog post on designing connectors for homegrown or
      legacy systems: standalone vs. embedded ingestion, attribute selection,
