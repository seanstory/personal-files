# Sean Story — accomplishment pool
#
# The source of truth for every resume variant. Think of it as a 100-page
# resume: professional and informative, but deliberately broader than any
# single application, and not polished for any particular audience.
#
# PUBLIC-SAFE ONLY. This file lives in a public repo. Do not add customer
# names, unreleased features, internal codenames, internal-only metrics, or
# anything else that isn't OK to share with a recruiter.
#
# Conventions:
#   - Dates are YYYY-MM. `end: null` means present.
#   - `id`s are kebab-case and stable; other entries reference them.
#   - `role` is the role where most of the work happened; `dates` may span
#     beyond that role when the work did.
#   - `description` is plain factual prose (a sentence to a paragraph), not
#     finished resume wording. Agents write the bullets.
#   - `tags` mix technologies (java, spark, ruby) and themes (leadership,
#     open-source, ai-agents). Prefer reusing existing tags.
#   - `links` are public URLs only.

