  - id: connectors-sync-framework-reliability
    role: elastic-principal-search-ingestion
    dates: { start: 2023-11, end: 2024-10 }
    tags: [connectors, python, asyncio, reliability, error-handling, bug-fix]
    description: >
      Fixed a series of reliability bugs in the core sync framework: sink and
      extractor errors now reach the orchestrator and end the job promptly
      instead of timing out; failed job claims fail with an actionable message
      instead of sitting "pending" forever; asyncio tasks are always cancelled
      on shutdown; and full syncs genuinely re-sync, removing a timestamp
      optimization that forced users to wipe data after any code, pipeline, or
      config change.
    links:
      - https://github.com/elastic/connectors/pull/2364
      - https://github.com/elastic/connectors/pull/2606

